 else if(a==="dpick"){const src=S.rt.find(x=>x.id===+D.r).days.find(x=>x.id===+D.d),cp=JSON.parse(JSON.stringify(src));cp.id=Date.now();cp.wd=[];r.days.push(cp);V.dsh=0}
 else if(a==="dhist"){const h=histU()[+D.i],tp=n=>{for(const x of S.rt)for(const dd of x.days){const e=dd.ex.find(q=>q.n===n);if(e)return e.type}return"Machine"};r.days.push({id:Date.now(),name:h.name,wd:[],ex:h.ex.map(x=>({n:x.n,type:tp(x.n),s:x.sets.length,r:Math.round(x.sets.reduce((a,s)=>a+s.r,0)/x.sets.length)||8,mode:"stack"}))});V.dsh=0}
 else if(a==="dayv"){V.did=+D.d;V.v="day"}
 else if(a==="wd"){const w=+D.w,i=d.wd.indexOf(w);i>=0?d.wd.splice(i,1):d.wd.push(w)}
 else if(a==="exed")V.sh={i:+D.i};else if(a==="addex")V.sh={i:-1};else if(a==="shx")V.sh=null;
 else if(a==="shs"){const n=$("f_n").value.trim();if(!n)return;const o={n,type:$("f_t").value,s:+$("f_s").value||3,r:+$("f_r").value||8};if(V.sh.i>=0)Object.assign(d.ex[V.sh.i],o);else d.ex.push(o);V.sh=null}
 else if(a==="delex"){d.ex.splice(V.sh.i,1);V.sh=null}
 else if(a==="start")return startWorkout();
 else if(a==="start1"){V.did=+D.d;V.rid=+D.r||rt().id;return startWorkout()}
 else if(a==="chg"){V.v="routine"}
 else if(a==="resume")V.v="workout";
 else if(a==="cancel"){if(!confirm("Training abbrechen? Die Daten gehen verloren."))return;S.cur=null;V.v="today"}
 else if(a==="fin"){const ex=c.ex.map(x=>({n:x.n,sets:x.sets.filter(s=>s.d).map(s=>({w:+s.w||0,r:+s.r||0}))})).filter(x=>x.sets.length);if(!ex.length&&!confirm("Keine Sätze abgehakt. Training verwerfen?"))return;if(ex.length)S.hist.push({t:c.t,dur:(Date.now()-c.t)/1000,name:c.name,ex});S.cur=null;V.v="today"}
 else if(a==="rl"){const L=[60,90,120,150,180];c.rl=L[(L.indexOf(c.rl)+1)%5]}
 else if(a==="ck"){const s=c.ex[+D.e].sets[+D.s];s.d=s.d?0:1;if(s.d)c.rest=Date.now()}
 else if(a==="ds"){if(!confirm("Satz löschen?"))return;c.ex[+D.e].sets.splice(+D.s,1)}
 else if(a==="as"){const ss=c.ex[+D.e].sets,l=ss[ss.length-1]||{w:"",r:c.ex[+D.e].t};ss.push({w:l.w,r:l.r,d:0})}
 else if(a==="trk")return selectEx(+D.e);
 else if(a==="tx"){T.run=false;V.v="workout"}
 else if(a==="kgm"||a==="kgp"){T.kg=Math.max(0,+(T.kg+(a==="kgp"?1:-1)*(S.step||2.5)).toFixed(1));$("kg").textContent=T.kg;c.ex[T.ei].sets[T.si].w=T.kg;const el=document.querySelector('[data-f="w"][data-e="'+T.ei+'"][data-s="'+T.si+'"]');if(el)el.value=T.kg;save();return}
 else if(a==="go"){goBtn();return}
 else if(a==="rom"){if(T.run)return;if(confirm("Bewegungsumfang für dieses Gerät neu messen?")){delete S.rom[T.ex.n];save();T.msg="Der Umfang wird beim nächsten Satz neu gemessen."}return}
 else if(a==="conn"){connect();return}
 else if(a==="disc"){const d=BD;BD=null;if(d&&d.gatt&&d.gatt.connected)d.gatt.disconnect();conn=""}
 else if(a==="zero"){if(E.gf)E.g0=E.gf.slice();E.gp=0;E.gv=0;return}
 else if(a==="rcs"){if(!conn){alert("Bitte zuerst den Tracker verbinden.");return}REC.note=$("rc_note")?$("rc_note").value:REC.note;REC.state="count";REC.cd=performance.now()+3000;REC.data=[];REC.on=false;REC.csv="";beep(500)}
 else if(a==="rcc"){try{navigator.clipboard.writeText(REC.csv).then(()=>alert("Daten kopiert."),()=>alert("Kopieren nicht erlaubt. Nutze Teilen / Speichern."))}catch(e){alert("Kopieren nicht möglich. Nutze Teilen / Speichern.")}return}
 else if(a==="rcd"){const f=new File([REC.csv],"reptracker-aufnahme.csv",{type:"text/csv"});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:"RepTracker Aufnahme"}).catch(()=>{});else{const l=document.createElement("a");l.href=URL.createObjectURL(f);l.download=f.name;document.body.appendChild(l);l.click();l.remove()}return}
 else if(a==="rm"||a==="tu"||a==="td")S[a]=+D.x;
 else if(a==="set")S[D.k]=+D.x;
 else if(a==="romreset"){if(!confirm("Alle gemessenen Bewegungsumfänge zurücksetzen? Sie werden beim nächsten Satz neu gemessen."))return;S.rom={}}
 else if(a==="name"){const n=prompt("Dein Name",S.name||"");if(n===null)return;S.name=n.trim()}
 else if(a==="exp"){const j=JSON.stringify(S);try{navigator.clipboard.writeText(j).then(()=>alert("Daten in die Zwischenablage kopiert."),()=>prompt("Daten kopieren:",j))}catch(e){prompt("Daten kopieren:",j)}return}
 else if(a==="imp"){const j=prompt("Exportierte Daten hier einfügen");if(!j)return;try{const o=JSON.parse(j);if(!o.rt)throw 0;S=o;S.rom=S.rom||{}}catch(e){alert("Das sind keine gültigen Daten.");return}}
 else if(a==="reset"){if(!confirm("Wirklich alle Daten löschen?"))return;S=seed();V.v="today"}
 save();R()});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.f&&S.cur){S.cur.ex[+t.dataset.e].sets[+t.dataset.s][t.dataset.f]=t.value;if(T&&t.dataset.f==="w"&&+t.dataset.e===T.ei&&+t.dataset.s===T.si){T.kg=+t.value||0;if($("kg"))$("kg").textContent=T.kg}save()}});
document.addEventListener("change",e=>{if(e.target.id==="pe"){V.pe=e.target.value;R()}});
document.addEventListener("pointerdown",e=>{if(e.target.closest("#trk"))down=true});["pointerup","pointercancel"].forEach(k=>document.addEventListener(k,()=>down=false));
setInterval(()=>{const c=S.cur;if(V.v!=="workout"||!c)return;if($("el"))$("el").textContent=fmt((Date.now()-c.t)/1000);const r=$("rest");if(!r)return;
 if(c.rest){const rem=c.rl-(Date.now()-c.rest)/1000;if(rem<=0){c.rest=0;save();navigator.vibrate&&navigator.vibrate([100,60,100]);beep(900);r.style.visibility="hidden"}else{r.style.visibility="visible";r.textContent="Pause "+fmt(rem)}}else r.style.visibility="hidden"},500);
R();
</script></body></html>
